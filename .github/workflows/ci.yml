name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build extra-cmake-modules catch2 \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev \
            fcitx5-modules fcitx5 dbus-daemon python3-gi

      # CMakeLists.txt skips the Fcitx5 addon quietly when Fcitx5 isn't found; here that's an error.
      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DXRNKEY_ENABLE_TESTS=ON
          -DCMAKE_REQUIRE_FIND_PACKAGE_Fcitx5Core=ON

      - name: Build
        run: cmake --build build

      # Includes the addon's end-to-end tests: one loads the built addon into an
      # in-process Fcitx5 (fcitx5-modules ships the testim addon it needs), one runs
      # the fcitx5 binary on a private D-Bus and types into it (fcitx5, dbus-daemon,
      # python3-gi).
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Install into a staging folder
        run: DESTDIR="$RUNNER_TEMP/stage" cmake --install build

      # The IBus engine and the CLI tools are scripts, not compiled, so at least parse them.
      - name: Syntax-check the scripts
        run: |
          python3 -m py_compile ibus-engine/*.py ibus-engine/xrnkey-ibus \
            cli-tools/xk-dict.py cli-tools/xk-macro.py data/emoji/generate.py data/ngram/train.py \
            fcitx5-addon/tests/dbus_driver.py data/lm/build.py data/lm/xklm_text.py tools/xk-eval
          for f in cli-tools/*.sh data/dict/build_dict.sh \
                   fcitx5-addon/tests/*.sh; do bash -n "$f"; done

  # The Android keyboard: its JVM tests against the engine built for the runner, a debug APK
  # with the small test models (the trained ones are never in git), and no permissions in it.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # The system CMake: the core needs 3.27 or newer.
      - name: Point Gradle at the SDK and CMake
        run: printf 'sdk.dir=%s\ncmake.dir=/usr\n' "$ANDROID_HOME" > local.properties

      - name: JVM tests and a debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: The APK asks for no permission
        run: |
          perms=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep uses-permission || true)
          if [ -n "$perms" ]; then echo "$perms"; exit 1; fi
